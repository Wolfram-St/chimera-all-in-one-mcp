[package]
name = "chimera-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
